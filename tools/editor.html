      state.friends = j.data || { list: [] };
      state.friends.list = state.friends.list || [];
      $('#friendsForm').innerHTML =
        '<label class="full">页面导语<textarea id="fr-intro" rows="2">' + esc(state.friends.intro || '') + '</textarea></label>' +
        '<label class="full">没有友链时的文字<input id="fr-empty" value="' + esc(state.friends.emptyText || '') + '"></label>' +
        '<label class="full">底部说明<input id="fr-apply" value="' + esc(state.friends.applyText || '') + '"></label>';
      renderFriends();
    });
  }
  function renderFriends() {
    var host = $('#friendsRows');
    host.innerHTML = rowsHTML(state.friends.list, ['name', 'avatar', 'url', 'desc'], { name: '站名', avatar: '头像', url: '链接', desc: '简介' });
    bindDelete(host, state.friends.list, renderFriends);
  }
  $('#addFriend').onclick = function () {
    state.friends.list.push({ name: '', avatar: '', url: '', desc: '' });
    renderFriends();
  };
  $('#saveFriends').onclick = function () {
    state.friends.intro = $('#fr-intro').value;
    state.friends.emptyText = $('#fr-empty').value;
    state.friends.applyText = $('#fr-apply').value;
    readRows($('#friendsRows'), state.friends.list, []);
    post('/api/friends', { data: state.friends }).then(function () { toast('友链已保存'); }).catch(function (e) { toast(e.message, true); });
  };

  /* ================= 台词 ================= */
  function loadQuotes() {
    api('/api/quotes').then(function (j) {
      state.quotes = (j.data && j.data.quotes) || [];
      renderQuotes();
    });
  }
  function renderQuotes() {
    var host = $('#quoteRows');
    host.innerHTML = rowsHTML(state.quotes, ['text', 'from'], { text: '台词', from: '出处' });
    bindDelete(host, state.quotes, renderQuotes);
  }
  $('#addQuote').onclick = function () { state.quotes.push({ text: '', from: '' }); renderQuotes(); };
  $('#saveQuotes').onclick = function () {
    readRows($('#quoteRows'), state.quotes, []);
    post('/api/quotes', { data: { quotes: state.quotes } }).then(function () { toast('台词已保存'); }).catch(function (e) { toast(e.message, true); });
  };

  /* ================= 音乐 ================= */
  function loadMusic() {
    api('/api/site').then(function (j) {
      state.site = j.data;
      state.site.music = state.site.music || { songs: [] };
      $('#musicTitle').value = state.site.music.title || '';
      if ($('#musicAutoplay')) $('#musicAutoplay').checked = state.site.music.autoplay !== false;
      var vol0 = typeof state.site.music.volume === 'number' ? state.site.music.volume : 0.3;
      if ($('#musicVolume')) {
        $('#musicVolume').value = Math.round(vol0 * 100);
        $('#musicVolumeNum').textContent = Math.round(vol0 * 100) + '%';
      }
      renderMusic();
    });
  }
  function renderMusic() {
    var host = $('#musicRows');
    var songs = state.site.music.songs || [];
    host.innerHTML = songs.map(function (s, i) {
      var local = !!s.src;
      return '<div class="music-row" draggable="false" data-row="' + i + '">' +
        '<span class="m-idx">' + (i + 1) + '</span>' +
        '<span class="m-drag" title="拖动排序">⠿</span>' +
        '<label>名称<input data-song="' + i + '" data-k="name" value="' + esc(s.name || '') + '">' +
        (s.ok === false ? '<span class="status">⚠ 放不出来</span>' : '') + '</label>' +
        '<label>' + (local ? '本地文件' : '网易云 id') + '<input data-song="' + i + '" data-k="' + (local ? 'src' : 'id') + '" value="' + esc(local ? s.src : (s.id || '')) + '"></label>' +
        '<span class="m-move"><button type="button" data-move="up" data-row="' + i + '" title="上移">↑</button>' +
        '<button type="button" data-move="down" data-row="' + i + '" title="下移">↓</button></span>' +
        '<button class="ghost sm del" data-songdel="' + i + '">×</button></div>';
    }).join('') || '<p class="status">还没有歌，点下面「上传本地音乐」或「手动加一首」。</p>';

    /* 删除 */
    host.onclick = function (e) {
      var b = e.target.closest('[data-songdel]');
      if (b) {
        syncSongs();
        var idx = Number(b.getAttribute('data-songdel'));
        var song = songs[idx];
        var finish = function () {
          songs.splice(idx, 1);
          renderMusic();
        };
        if (song && song.src) {
          confirmBox('删除这首歌', '会同时删掉 assets/audio 里的音频文件（保存后才会真正清理）。', '删除并清理文件', true).then(function (yes) {
            if (!yes) return;
            finish();
            post('/api/site', { data: state.site }).then(function () {
              post('/api/file/delete', { path: song.src }).then(function () {
                toast('已删除并清理音频文件');
              }).catch(function (err) {
                toast('歌单已移除，但文件没删：' + err.message, true);
              });
            }).catch(function (err) { toast(err.message, true); });
          });
        } else {
          finish();
        }
        return;
      }
      var mv = e.target.closest('[data-move]');
      if (mv) {
        syncSongs();
        var from = Number(mv.getAttribute('data-row'));
        var to = mv.getAttribute('data-move') === 'up' ? from - 1 : from + 1;
        if (to < 0 || to >= songs.length) return;
        var item = songs.splice(from, 1)[0];
        songs.splice(to, 0, item);
        renderMusic();
      }
    };

    /* 拖拽排序 */
    var dragFrom = -1;
    $$('.music-row', host).forEach(function (row) {
      var grip = $('.m-drag', row);
      if (grip) {
        grip.addEventListener('mousedown', function () { row.draggable = true; });
        grip.addEventListener('touchstart', function () { row.draggable = true; }, { passive: true });
      }
      row.addEventListener('dragstart', function (e) {
        syncSongs();
        dragFrom = Number(row.getAttribute('data-row'));
        row.classList.add('dragging');
        try { e.dataTransfer.setData('text/plain', String(dragFrom)); e.dataTransfer.effectAllowed = 'move'; } catch (err) {}
      });
      row.addEventListener('dragend', function () { row.draggable = false; row.classList.remove('dragging'); });
      row.addEventListener('dragover', function (e) { e.preventDefault(); row.classList.add('over'); });
      row.addEventListener('dragleave', function () { row.classList.remove('over'); });
      row.addEventListener('drop', function (e) {
        e.preventDefault();
        row.classList.remove('over');
        var to = Number(row.getAttribute('data-row'));
        if (dragFrom < 0 || dragFrom === to) return;
        syncSongs();
        var moved = songs.splice(dragFrom, 1)[0];
        songs.splice(to, 0, moved);
        dragFrom = -1;
        renderMusic();
      });
    });
  }
  function syncSongs() {
    $$('#musicRows [data-song]').forEach(function (inp) {
      var i = Number(inp.getAttribute('data-song'));
      var song = state.site.music.songs[i];
      if (!song) return;
      var k = inp.getAttribute('data-k');
      song[k] = inp.value;
    });
  }
  $('#uploadMusic').onclick = function () {
    upload(function (j) {
      state.site.music.songs = state.site.music.songs || [];
      state.site.music.songs.push({ src: j.path, name: j.name.replace(/\.[^.]+$/, '') });
      renderMusic();
      toast('已添加：' + j.name);
    }, { audio: true });
  };
  $('#addMusic').onclick = function () {
    state.site.music.songs = state.site.music.songs || [];
    state.site.music.songs.push({ id: '', name: '' });
    renderMusic();
  };
  $('#parseMusic').onclick = function () {
    var url = $('#musicUrl').value.trim();
    if (!url) return toast('先粘贴链接', true);
    post('/api/music/parse', { url: url }).then(function (j) {
      state.site.music.songs = state.site.music.songs || [];
      state.site.music.songs.push({ id: j.id, name: j.name, ok: j.playable !== false });
      $('#musicUrl').value = '';
      renderMusic();
      toast(j.hint ? ('已添加：' + j.name + '（' + j.hint + '）') : ('已添加：' + j.name));
    }).catch(function (e) { toast(e.message, true); });
  };
  if ($('#musicVolume')) {
    $('#musicVolume').addEventListener('input', function () {
      $('#musicVolumeNum').textContent = this.value + '%';
    });
  }
  $('#saveMusic').onclick = function () {
    $$('#musicRows [data-song]').forEach(function (inp) {
      var i = Number(inp.getAttribute('data-song'));
      state.site.music.songs[i][inp.getAttribute('data-k')] = inp.value;
    });
    state.site.music.title = $('#musicTitle').value;
    if ($('#musicVolume')) state.site.music.volume = Number($('#musicVolume').value) / 100;
    if ($('#musicAutoplay')) state.site.music.autoplay = $('#musicAutoplay').checked;
    post('/api/site', { data: state.site }).then(function () { toast('歌单已保存'); }).catch(function (e) { toast(e.message, true); });
  };

  /* ================= 环境 ================= */

  /* ===== 桌面快捷方式 ===== */
  function shortcutApi(action) {
    var opt = action
      ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: action }) }
      : { method: 'GET' };
    return fetch('/api/shortcut', opt).then(function (r) { return r.json(); });
  }
  function renderShortcutRow(st) {
    var box = $('#shortcutRow');
    if (!box) return;
    box.innerHTML =
      '<div class="env-row ' + (st.exists ? 'ok' : 'warn') + '">' +
        '<span class="env-dot">' + (st.exists ? '✓' : '!') + '</span>' +
        '<span class="env-main"><b>桌面快捷方式</b><span>' +
          (st.exists ? '已创建：' + esc(st.path || '') : '还没有，创建后双击图标就能打开写作台') +
        '</span></span>' +
        (st.exists ? '' : '<button class="ghost sm" data-sc="create">创建</button>') +
        '<button class="ghost sm" data-sc="' + (st.suppressed ? 'reset' : 'never') + '">' +
          (st.suppressed ? '恢复提示' : '不再提示') + '</button>' +
      '</div>';
  }
  function checkShortcut(showModal) {
    return shortcutApi().then(function (st) {
      renderShortcutRow(st);
      if (showModal !== false && !st.exists && !st.suppressed) showShortcutModal();
      return st;
    }).catch(function () {});
  }
  function showShortcutModal() {
    if (document.querySelector('.ed-modal[data-sc]')) return;
    var mask = document.createElement('div');
    mask.className = 'ed-modal';
    mask.setAttribute('data-sc', '1');
    mask.innerHTML = '<div class="ed-modal-card"><h3>创建桌面快捷方式</h3>' +
      '<p class="ed-hint">以后双击桌面上的图标就能打开写作台，不用每次翻文件夹。</p>' +
      '<div class="ed-modal-actions">' +
        '<button type="button" class="ghost" data-sc="later">以后再说</button>' +
        '<button type="button" class="ghost" data-sc="never">不再提示</button>' +
        '<button type="button" class="primary" data-sc="create">创建到桌面</button>' +
      '</div></div>';
    document.body.appendChild(mask);
    mask.addEventListener('click', function (ev) {
      var act = ev.target.getAttribute && ev.target.getAttribute('data-sc');
      if (!act) { if (ev.target === mask) mask.remove(); return; }
      if (act === 'later') { mask.remove(); return; }
      shortcutApi(act).then(function (res) {
        mask.remove();
        renderShortcutRow(res);
        toast(act === 'create'
          ? (res.created ? '已创建桌面快捷方式' : '创建失败，请稍后再试')
          : (act === 'never' ? '以后不再提示' : '已恢复提示'));
      }).catch(function (err) { toast(err.message, true); });
    });
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('#shortcutRow [data-sc]') : null;
    if (!b) return;
    shortcutApi(b.getAttribute('data-sc')).then(function (res) {
      renderShortcutRow(res);
      toast(res.exists ? '桌面快捷方式已就绪' : '设置已保存');
    });
  });
  setTimeout(function () { checkShortcut(); }, 1200);

  function loadEnv() {
    $('#envStatus').textContent = '检查中…';
    api('/api/env').then(function (j) {
      $('#envStatus').textContent = j.ok ? '必需项都齐了' : '有必需项没满足';
      $('#envList').innerHTML = j.items.map(function (i) {
        var dot = i.level === 'info' ? '·' : (i.ok ? '✓' : '✗');
        var fix = (!i.ok && i.fix && i.fix.url)
          ? '<a class="ghost sm" href="' + i.fix.url + '" target="_blank" rel="noopener">' + esc(i.fix.text || '去安装') + '</a>'
          : '';
        return '<div class="env-row ' + (i.ok ? 'ok' : 'bad') + '">' +
          '<span class="env-dot">' + dot + '</span>' +
          '<span class="env-main"><b>' + esc(i.label) + '</b><span>' + esc(i.detail) + '</span></span>' +
          fix + '</div>';
      }).join('');
    }).catch(function (e) {
      $('#envStatus').textContent = e.message;
    });
  }
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('#recheckEnv')) { loadEnv(); checkShortcut(false); }
    if (e.target.closest && e.target.closest('#cleanupFiles')) {
      confirmBox('清理未使用的文件', '会删除 assets/audio 和 assets/img/posts 里没有被任何文章/说说/相册引用的文件。确定？', '开始清理', true).then(function (yes) {
        if (!yes) return;
        post('/api/cleanup', {}).then(function (j) {
          toast(j.removed ? ('清理了 ' + j.removed + ' 个文件') : '没有需要清理的文件');
        }).catch(function (err) { toast(err.message, true); });
      });
    }
  });

  /* ================= 发布 ================= */
  function loadStatus() {
    api('/api/status').then(function (j) {
      $('#pubStatus').textContent = '分支 ' + (j.branch || '-') + ' · 待提交 ' + j.changes.length + ' 个文件 · 文章 ' + j.posts + ' 篇';
      if (j.remote && $('#gitRemote') && !$('#gitRemote').value) $('#gitRemote').value = j.remote;
    });
  }
  function gitAction(action) {
    var el = $('#pubLog');
    el.textContent = '执行中…';
    post('/api/git', { action: action, message: $('#commitMsg').value.trim(), remote: $('#gitRemote') ? $('#gitRemote').value.trim() : '', token: $('#gitToken') ? $('#gitToken').value.trim() : '' }).then(function (j) {
      el.textContent = (j.log || []).join('\n') + (j.hint ? '\n\n' + j.hint : '');
      toast(j.ok ? '完成' : (j.hint || '失败'), !j.ok);
      loadStatus();
    }).catch(function (e) { el.textContent = e.message; toast(e.message, true); });
  }
  $('#btnCommit').onclick = function () { gitAction('commit'); };
  $('#btnPush').onclick = function () { gitAction('push'); };
  $('#btnSync').onclick = function () { gitAction('sync'); };
  $('#btnPull').onclick = function () { gitAction('pull'); };

  $('#buildBtn').onclick = function () {
    post('/api/build', {}).then(function () { toast('已重新构建'); }).catch(function (e) { toast(e.message, true); });
  };
  $('#shutdownBtn').onclick = function () {
    confirmBox('停止写作台', '本地服务会关闭，页面 3 秒后尝试自动关上。', '停止', true).then(function (yes) {
      if (!yes) return;
      post('/api/shutdown', {}).catch(function () {}).finally(function () {
        var n = 3;
        document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;gap:8px;font-family:sans-serif"><b>写作台已停止</b><p id="bye">这个页面会在 3 秒后自动关闭…</p></div>';
        var t = setInterval(function () {
          n--;
          if (n > 0) { document.getElementById('bye').textContent = '这个页面会在 ' + n + ' 秒后自动关闭…'; return; }
          clearInterval(t);
          window.close();
          setTimeout(function () {
            document.body.innerHTML = '<div style="padding:60px;text-align:center;font-family:sans-serif">写作台已停止，可以关掉这个页面了。</div>';
          }, 500);
        }, 1000);
      });
    });
  };
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      var active = $('.pane.on');
      if (!active) return;
      var map = { 'pane-posts': '#savePost', 'pane-site': '#saveSite', 'pane-about': '#saveAbout', 'pane-moments': '#saveMoments', 'pane-gallery': '#saveGallery', 'pane-friends': '#saveFriends', 'pane-quotes': '#saveQuotes', 'pane-music': '#saveMusic' };
      var target = map[active.id];
      if (target && $(target)) $(target).click();
    }
  });

  /* 启动 */
  var startTab = '';
  try { startTab = new URLSearchParams(location.search).get('tab') || ''; } catch (e) {}
  if (startTab && $('[data-tab="' + startTab + '"]')) $('[data-tab="' + startTab + '"]').click();
  else loadPosts();

  /* ===== 行内缩略图 ===== */
  document.addEventListener('input', function (ev) {
    var inp = ev.target;
    if (!inp || !inp.getAttribute || !inp.getAttribute('data-k')) return;
    var label = inp.closest('label');
    var img = label ? label.querySelector('.row-thumb') : null;
    if (!img) return;
    img.src = inp.value;
    img.classList.toggle('is-on', !!inp.value);
  });

  /* ===== 行内图片上传 ===== */
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.row-up') : null;
    if (!b) return;
    e.preventDefault();
    var row = b.closest('.r');
    if (!row) return;
    var key = b.getAttribute('data-up');
    var inp = row.querySelector('input[data-k="' + key + '"]');
    if (!inp) return;
    upload(function (j) {
      inp.value = j.url;
      var img = inp.closest('label') ? inp.closest('label').querySelector('.row-thumb') : null;
      if (img) { img.src = j.url; img.classList.add('is-on'); }
      toast('已上传');
    }, { max: key === 'avatar' ? 400 : 1600 });
  });

  /* ===== 没有工具栏的文本框：链接 / 图片 / 加粗 / 表情 / 全屏 ===== */
  var EMOJIS = ['🌙','✨','🍃','☕','🎐','😊','💭','🌸'];
  function mkBtn(text, fn) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'ghost sm';
    b.textContent = text;
    b.onclick = fn;
    return b;
  }
  function addFullToRich(ta) {
    var field = ta.closest('.rich-field');
    if (!field) return;
    var bar = field.querySelector('.rich-bar');
    if (!bar || bar.querySelector('[data-fsbtn]')) return;
    var b = mkBtn('⛶ 全屏', function () { openFull(ta); });
    b.setAttribute('data-fsbtn', '1');
    bar.appendChild(b);
  }
  function addMiniBar(ta) {
    if (!ta || ta.id === 'body' || ta.dataset.minibar) return;
    if (ta.closest('.rich-field')) { addFullToRich(ta); return; }
    ta.dataset.minibar = '1';
    var bar = document.createElement('div');
    bar.className = 'mini-linkbar';
    bar.appendChild(mkBtn('🔗 链接', function () { insertLink(ta); }));
    bar.appendChild(mkBtn('🖼 图片', function () { pickImage(ta); }));
    bar.appendChild(mkBtn('B 加粗', function () {
      var s = ta.selectionStart, e2 = ta.selectionEnd;
      var sel = ta.value.slice(s, e2) || '加粗文字';
      insertAt(ta, '**' + sel + '**');
    }));
    var emo = mkBtn('😊 表情', function () {
      var pop = document.createElement('div');
      pop.className = 'emoji-pop';
      var r = emo.getBoundingClientRect();
      pop.style.left = Math.max(8, r.left - 40) + 'px';
      pop.style.top = (r.bottom + window.scrollY + 6) + 'px';
      EMOJIS.forEach(function (ch) {
        var b2 = mkBtn(ch, function () { insertAt(ta, ch); pop.remove(); });
        b2.style.fontSize = '1.1rem';
        pop.appendChild(b2);
      });
      document.body.appendChild(pop);
      setTimeout(function () {
        document.addEventListener('click', function close(ev) {
          if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener('click', close); }
        });
      }, 0);
    });
    bar.appendChild(emo);
    bar.appendChild(mkBtn('⛶ 全屏', function () { openFull(ta); }));
    ta.parentNode.insertBefore(bar, ta);
  }
  function scanTextareas() {
    [].slice.call(document.querySelectorAll('textarea')).forEach(addMiniBar);
  }
  scanTextareas();
  function killAutofill() {
    [].slice.call(document.querySelectorAll('input, textarea')).forEach(function (el) {
      if (el.dataset.noaf) return;
      el.dataset.noaf = '1';
      el.setAttribute('autocomplete', 'off');
      el.setAttribute('autocorrect', 'off');
      el.setAttribute('autocapitalize', 'off');
      el.setAttribute('spellcheck', 'false');
    });
  }
  killAutofill();
  new MutationObserver(function () { setTimeout(function () { scanTextareas(); killAutofill(); }, 60); }).observe(document.body, { childList: true, subtree: true });

})();
</script>
</div>
</body>
</html>
