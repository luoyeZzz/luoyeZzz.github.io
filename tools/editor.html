<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>洛月 · 写作台</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<script>(function(){try{var q=new URLSearchParams(location.search).get('theme');if(q==='dark')document.documentElement.setAttribute('data-theme','dark');else if(localStorage.getItem('sb-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  html{font-size:17px}
  body.admin{font-size:.9375rem;line-height:1.7;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  label,.r label{font-size:.8125rem}
  input,select,textarea{font-size:.9375rem!important}
  .adm-tabs button{font-size:.875rem}
  .list-item strong{font-size:.9375rem}
  body.admin{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh}
  .adm-bar{position:sticky;top:12px;z-index:60;margin:12px auto 0;max-width:1560px;padding:0 14px}
  .adm-bar-in{min-width:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;
    padding:8px 12px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--glass-edge);
    -webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);
    box-shadow:var(--shadow-soft),inset 0 1px 0 rgba(255,255,255,.5)}
  .adm-brand{display:flex;align-items:center;gap:9px;font-size:.9375rem;font-weight:600;letter-spacing:.2em}
  .adm-brand img{width:30px;height:30px;border-radius:50%;object-fit:cover}
  .adm-brand span{font-family:var(--mono);font-size:.625rem;letter-spacing:.18em;color:var(--ink-3);letter-spacing:.2em}
  .adm-tabs{display:flex;gap:2px;justify-self:center;flex-wrap:wrap;min-width:0}
  .adm-tabs button{border:0;background:transparent;color:var(--ink-2);font-size:.8125rem;
    padding:7px 11px;border-radius:var(--r-pill);cursor:pointer;transition:.25s var(--ease);white-space:nowrap}
  .adm-tabs button:hover{background:var(--accent-wash);color:var(--ink)}
  .adm-tabs button.on{background:var(--accent-wash);color:var(--ink)}
  .adm-tools{display:flex;gap:8px;justify-self:end;align-items:center}

  .adm-main{max-width:1560px;margin:0 auto;padding:14px;position:relative;z-index:1}
  .pane:not(.on){display:none !important}
  .pane.on{display:block}
  .pane.on.two{display:grid}
  .two{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
  .card{background:var(--surface);border:1px solid var(--glass-edge);border-radius:var(--r-card);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--glass-soft,var(--shadow-soft));
    padding:16px}
  .card h3{margin:0 0 12px;font-size:.9375rem;font-weight:600}

  .list{position:sticky;top:78px;max-height:calc(100vh - 100px);overflow:auto;padding:10px}
  .list-head{display:flex;gap:6px;margin-bottom:8px}
  .list-item{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;
    border-radius:10px;padding:9px 10px;cursor:pointer;transition:.2s}
  .list-item:hover{background:var(--accent-wash)}
  .list-item.on{border-color:var(--accent-soft);background:var(--accent-wash)}
  .li-t{display:block;font-size:.875rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .li-m{display:block;font-size:.6875rem;color:var(--ink-3);margin-top:2px}

  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form .full{grid-column:1 / -1}
  .form h4{grid-column:1/-1;margin:12px 0 0;font-size:.6875rem;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
  label{display:block;font-size:.6875rem;color:var(--ink-3);letter-spacing:.08em}
  label input,label select,label textarea{width:100%;margin-top:4px}
  input,select,textarea{font-family:inherit;font-size:.875rem;color:var(--ink);background:var(--surface-solid);
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;transition:border-color .2s}
  input:focus,select:focus,textarea:focus{border-color:var(--accent-soft)}
  textarea{resize:vertical;line-height:1.8}
  .chk{display:flex;align-items:center;gap:7px;font-size:.8125rem;color:var(--ink-2);padding-top:18px}
  .chk input{width:auto;margin:0}

  button{border:0;cursor:pointer;font-family:inherit;color:inherit}
  .primary{background:var(--ink);color:var(--bg);border-radius:var(--r-pill);padding:10px 20px;font-size:.8125rem;letter-spacing:.06em}
  .primary:hover{opacity:.9}
  .ghost{background:transparent;border:1px solid var(--line);border-radius:var(--r-pill);padding:8px 14px;
    font-size:.75rem;color:var(--ink-2);transition:.25s}
  .ghost:hover{border-color:var(--accent-soft);color:var(--accent)}
  .danger{color:#B3305F;border-color:#E3A9BC}
  .sm{padding:5px 10px;font-size:.6875rem;border-radius:8px}
  .row-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}

  .ed-top{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .title-input{flex:1;font-size:1.125rem;font-weight:600;padding:10px 12px}
  .meta2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
  .meta3{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:8px;margin-bottom:8px}
  .body-wrap{display:grid;grid-template-columns:1fr;gap:10px}
  .body-wrap.split{grid-template-columns:1fr 1fr}
  #body{min-height:460px;font-family:var(--mono);font-size:.8125rem;line-height:1.9}
  .preview{display:none;max-height:520px;overflow:auto;border:1px dashed var(--line);border-radius:12px;padding:4px 14px;background:var(--surface-solid)}
  .body-wrap.split .preview{display:block}
  .toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .toolbar button{border:1px solid var(--line);background:transparent;border-radius:var(--r-pill);
    padding:5px 11px;font-size:.75rem;color:var(--ink-2)}
  .toolbar button:hover{border-color:var(--accent-soft);color:var(--accent)}

  .rows{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
  .r{display:grid;gap:8px;align-items:end;padding:10px;border:1px solid var(--line-soft);border-radius:12px}
  .r .del{align-self:end}
  #albumImages{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
  .thumb{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .thumb img{width:100%;height:88px;object-fit:cover;display:block}
  .thumb button{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;
    width:20px;height:20px;font-size:11px;line-height:1}
  .thumb input{width:100%;border:0;border-radius:0;font-size:.6875rem;padding:5px 6px;background:var(--surface-solid)}

  .music-row{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;align-items:end}
  .status{font-size:.75rem;color:var(--ink-3)}
  .log{margin-top:12px;background:#241d26;color:#EAD9DF;border-radius:12px;padding:12px;
    font-family:var(--mono);font-size:.75rem;line-height:1.8;min-height:110px;max-height:320px;overflow:auto;white-space:pre-wrap}
  .env-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
  .env-row:last-child{border-bottom:0}
  .env-dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;flex:none;
    background:var(--accent-wash);color:var(--accent)}
  .env-row.bad .env-dot{background:#FBE3E8;color:#B3305F}
  .env-row.ok .env-dot{background:#E6F3EA;color:#2F7D4F}
  .env-main{flex:1;min-width:0;display:flex;flex-direction:column}
  .env-main b{font-size:.9375rem;font-weight:600}
  .env-main span{font-size:.75rem;color:var(--ink-3);word-break:break-all}
  .icon-pick{display:flex;gap:4px;align-items:end;padding-bottom:1px}
  .icon-pick-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:transparent;
    color:var(--ink-3);display:grid;place-items:center;font-size:.75rem;cursor:pointer;transition:.2s;padding:0}
  .icon-pick-btn:hover{border-color:var(--accent-soft);color:var(--accent)}
  .icon-pick-btn.is-on{border-color:var(--accent);color:var(--accent);background:var(--accent-wash)}
  /* 歌单行 */
  .music-row{display:grid;grid-template-columns:26px 18px minmax(0,1.2fr) minmax(0,1.4fr) auto auto;
    gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);
    margin-bottom:8px;transition:border-color .2s,opacity .2s}
  .music-row.dragging{opacity:.45}
  .music-row.over{border-color:var(--accent)}
  .m-idx{font-family:var(--mono);font-size:.75rem;color:var(--accent);text-align:center;padding-bottom:10px}
  .m-drag{cursor:grab;color:var(--ink-3);text-align:center;padding-bottom:10px;user-select:none;font-size:1rem;
    -webkit-user-drag:element}
  .m-move{display:flex;gap:3px;padding-bottom:0;align-self:center}
  .m-move button{width:24px;height:24px;border-radius:5px;border:1px solid var(--line);background:transparent;
    color:var(--ink-3);font-size:.6875rem;line-height:1;cursor:pointer;padding:0}
  .m-move button:hover{color:var(--accent);border-color:var(--accent-soft)}
  .m-drag:active{cursor:grabbing}
  @media (max-width:760px){
    .music-row{grid-template-columns:26px 18px 1fr auto}
    .music-row label:nth-of-type(2){grid-column:3/-1}
  }

  /* 说说：列表 + 编辑器 */
  .list-head{display:flex;gap:8px;margin-bottom:10px}
  .list-head input{flex:1;height:38px}
  .li-title{display:block;font-size:.875rem;line-height:1.45;color:var(--ink);margin-top:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .li-date{font-family:var(--mono);font-size:.6875rem;color:var(--ink-3);min-width:76px}
  .li-count{margin-left:auto;font-size:.6875rem;color:var(--accent);background:var(--accent-wash);
    padding:2px 7px;border-radius:8px;flex:none}
  .ed-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .ed-head h3{margin:0}
  #momentForm .r{grid-template-columns:160px}
  .rich-field{display:flex;flex-direction:column;gap:8px;grid-column:1/-1;width:100%}
  .rich-field textarea{width:100%}
  .rich-prev{display:none}
  .rich-prev:not(.is-empty){display:block;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;
    background:var(--bg-2);font-size:.875rem;line-height:1.8;color:var(--ink-2)}
  .rich-prev p{margin:0 0 8px}
  .rich-prev p:last-child{margin-bottom:0}
  .rich-prev img{display:block;max-width:100%;border-radius:10px;margin:6px 0}
  .rich-prev a{color:var(--accent)}

  /* 说说卡片 */
  .m-card{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface-solid);display:flex;flex-direction:column;gap:10px}
  .m-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .m-date{width:150px!important;height:34px!important;flex:none}
  .m-card textarea{min-height:70px;resize:vertical}
  .m-imgs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .m-img{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .m-img img{width:100%;height:100%;object-fit:cover;display:block}
  .m-img button{position:absolute;right:2px;top:2px;width:18px;height:18px;border-radius:50%;border:0;
    background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:1;display:grid;place-items:center;cursor:pointer}
  .emoji-grid{display:grid;grid-template-columns:repeat(6,44px);gap:6px}
  .emoji-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);
    font-size:1.25rem;line-height:1;cursor:pointer}
  .emoji-btn:hover{border-color:var(--accent)}
  .rich-bar{margin:2px 0 6px;display:flex;gap:6px;flex-wrap:wrap}

  /* 图标选择器 */
  .icon-pick{position:relative;display:flex;align-items:end}
  .icon-trigger{width:40px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-solid);
    display:grid;place-items:center;cursor:pointer;color:var(--ink);font-size:1.05rem;line-height:1}
  .icon-trigger:hover{border-color:var(--accent)}
  .icon-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;display:none;
    grid-template-columns:repeat(5,40px);gap:5px;padding:10px;border-radius:14px;
    background:var(--surface-solid);border:1px solid var(--line);box-shadow:0 18px 40px -20px rgba(40,20,30,.4)}
  .icon-pick.open .icon-pop{display:grid}
  .icon-opt{width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;
    display:grid;place-items:center;cursor:pointer;color:var(--ink);font-size:1.1rem;line-height:1;padding:0}
  .icon-opt:hover{border-color:var(--line);background:var(--bg-2)}
  .icon-opt.is-on{border-color:var(--accent);background:var(--accent-wash)}
  .icon-opt.emo{font-size:1.15rem}
  .icon-pop .icon-opt.auto{grid-column:span 1;width:auto;padding:0 6px;font-size:.75rem}
  .icon-auto{font-size:.75rem;color:var(--ink-3)}
  .pill-letter{font-size:.75rem;font-weight:600;letter-spacing:.02em}

  /* 图形化弹窗 */
  .modal{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;background:rgba(30,22,26,.32);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;transition:opacity .18s}
  .modal.on{opacity:1}
  .modal[hidden]{display:none}
  .modal-card{width:min(560px,100%);max-height:calc(100vh - 48px);margin:auto;overflow:auto;padding:22px 22px 16px;
    border-radius:18px;background:var(--surface-solid);color:var(--ink);border:1px solid var(--line);
    box-shadow:0 30px 70px -30px rgba(40,20,30,.35);transform:translateY(8px) scale(.98);transition:transform .2s}
  .modal.on .modal-card{transform:none}
  .modal-card h3{margin:0 0 12px;font-size:1rem;font-weight:600}
  .modal-card p{margin:0 0 14px;font-size:.875rem;color:var(--ink-2);line-height:1.7}
  .modal-card input{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);padding:0 12px;margin-bottom:14px;background:var(--bg-2);color:var(--ink)}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .trash-list{display:flex;flex-direction:column;gap:8px}
  .trash-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2)}
  .trash-main{flex:1;min-width:0;display:flex;flex-direction:column}
  .trash-main b{font-size:.9rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trash-main span{font-size:.75rem;color:var(--ink-3)}
  #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);background:var(--ink);color:var(--bg);
    padding:10px 20px;border-radius:var(--r-pill);font-size:.8125rem;opacity:0;pointer-events:none;
    transition:.25s;z-index:200}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #toast.err{background:#B3305F;color:#fff}

  @media (max-width:1100px){
    .two{grid-template-columns:1fr}
    .list{position:static;max-height:300px}
    .form{grid-template-columns:1fr}
    .meta3{grid-template-columns:1fr 1fr}
    .body-wrap.split{grid-template-columns:1fr}
  }
  @media (max-width:760px){
    .adm-bar{top:0;margin:0;padding:8px}
    .adm-bar-in{grid-template-columns:1fr auto;grid-template-areas:"brand tools" "tabs tabs";
      border-radius:16px;gap:8px;padding:10px 12px}
    .adm-brand{grid-area:brand;font-size:.875rem}
    .adm-brand span{display:none}
    .adm-tabs{grid-area:tabs;justify-self:stretch;flex-wrap:nowrap;overflow-x:auto;gap:0}
    .adm-tabs::-webkit-scrollbar{display:none}
    .adm-tabs button{padding:6px 9px;font-size:.8125rem}
    .adm-tools{grid-area:tools;justify-self:end;gap:6px}
    .adm-tools .ghost{display:none}
    .adm-main{padding:10px}
    .card{padding:12px;border-radius:16px}
    .form{grid-template-columns:1fr}
    .two{grid-template-columns:1fr}
    .list{max-height:240px}
    .modal-card{padding:18px 16px 14px;border-radius:16px}
    .modal-actions button{flex:1}
    .icon-pop{grid-template-columns:repeat(4,40px)}
    .rich-prev{padding:10px 12px}
  }
</style>
</head>
<body class="admin">
<div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <input id="modalInput" hidden>
      <div class="modal-actions">
        <button class="ghost" id="modalCancel">取消</button>
        <button class="primary" id="modalOk">确定</button>
      </div>
    </div>
  </div>

<header class="adm-bar">
  <div class="adm-bar-in">
    <div class="adm-brand"><img src="/assets/img/moon.svg" alt="">洛月<span>写作台</span></div>
    <nav class="adm-tabs" id="tabs">
      <button data-tab="posts" class="on">文章</button>
      <button data-tab="site">站点</button>
      <button data-tab="about">关于</button>
      <button data-tab="moments">说说</button>
      <button data-tab="gallery">相册</button>
      <button data-tab="friends">友链</button>
      <button data-tab="quotes">台词</button>
      <button data-tab="music">音乐</button>
      <button data-tab="env">环境</button>
      <button data-tab="publish">发布</button>
    </nav>
    <div class="adm-tools">
      <a class="ghost" href="/" target="_blank" style="text-decoration:none">查看站点</a>
      <button class="ghost" id="themeBtn">☀</button>
      <button class="ghost" id="buildBtn">重新构建</button>
      <button class="ghost" id="shutdownBtn">退出</button>
    </div>
  </div>
</header>

<main class="adm-main">

  <!-- 文章 -->
  <section class="pane on two" id="pane-posts">
    <aside class="card list">
      <div class="list-head"><input id="postFilter" placeholder="搜索…" style="flex:1"><button class="primary sm" id="newPost">＋</button></div>
      <div id="postList"></div>
      <div class="row-actions"><button class="ghost sm" id="trashBtn">回收站</button></div>
    </aside>
    <div class="card">
      <div class="ed-top">
        <input id="title" class="title-input" placeholder="文章标题">
        <span class="status" id="edStatus"></span>
        <button class="ghost sm" id="previewBtn">预览</button>
        <button class="ghost sm danger" id="delPost">删除</button>
        <button class="primary sm" id="savePost">保存</button>
      </div>
      <div class="meta3">
        <label>日期<input id="date" type="date"></label>
        <label>分类<input id="tag" placeholder="杂记"></label>
        <label>封面日文<input id="word" placeholder="ことば"></label>
        <label>配色<select id="tone"><option value="1">1 星空</option><option value="2">2 淡蓝</option><option value="3">3 青绿</option><option value="4">4 淡紫</option></select></label>
        <label class="chk"><input id="pinned" type="checkbox">置顶</label>
      </div>
      <div class="meta2">
        <label>摘要<input id="excerpt" placeholder="列表页的一句话"></label>
        <label>链接短名<input id="slug" placeholder="留空用日期"></label>
      </div>
      <div class="meta2">
        <label>封面图（路径或链接）<input id="cover" placeholder="/assets/img/... 或 https://..."></label>
        <label>&nbsp;<span style="display:flex;gap:6px"><button class="ghost sm" id="coverBtn">上传封面</button><button class="ghost sm" id="coverClear">清除</button></span></label>
      </div>
      <div class="toolbar" id="toolbar">
        <button data-ins="h2">小标题</button><button data-ins="dialogue">对白</button><button data-ins="note">便签</button>
        <button data-ins="quote">引用</button><button data-ins="img">图片</button><button data-ins="hr">分割线</button>
        <button id="uploadBody">＋ 上传图片</button>
        <button id="linkBody">＋ 图片链接</button>
      </div>
      <div class="body-wrap">
        <textarea id="body" placeholder="用 Markdown 写正文…"></textarea>
        <div class="preview prose" id="preview"></div>
      </div>
    </div>
  </section>

  <!-- 站点 -->
  <section class="pane" id="pane-site">
    <div class="card"><div class="form" id="siteForm"></div>

    document.documentElement.style.setProperty('--vt-y', y + 'px');
    document.startViewTransition(function () { applyTheme(next); });

  function iconMark(k) {

  function linkRowsHTML(arr) {
    return arr.map(function (row, i) {
      var cur = String(row.icon || '');

      var keys = Object.keys(ICON_MAP);
      var opts = '<button type="button" class="icon-opt auto' + (cur === '' ? ' is-on' : '') + '" data-icon="" data-pick="' + i + '" title="按链接自动识别">自动</button>' +
        keys.map(function (k) {
          return '<button type="button" class="icon-opt' + (cur === k ? ' is-on' : '') + '" data-icon="' + k + '" data-pick="' + i + '" title="' + esc(ICON_MAP[k].label) + '">' + iconMark(k) + '</button>';
        }).join('');
      return '<div class="r" style="grid-template-columns:1fr 1.3fr auto auto">' +
        '<label>名称<input data-i="' + i + '" data-k="label" value="' + esc(row.label || '') + '"></label>' +

        '<button class="ghost sm del" data-del="' + i + '">×</button></div>';
    }).join('');
  }
  /* 图形化弹窗：替代 confirm / prompt / alert */
  function modal(opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var m = $('#modal'), ok = $('#modalOk'), cancel = $('#modalCancel'), inp = $('#modalInput');
      $('#modalTitle').textContent = opts.title || '';
      $('#modalBody').innerHTML = opts.html || '';
      inp.hidden = !opts.input;
      inp.value = opts.value || '';
      inp.placeholder = opts.placeholder || '';
      ok.textContent = opts.okText || '确定';
      ok.className = opts.danger ? 'primary danger' : 'primary';
      cancel.hidden = opts.hideCancel === true;
      m.hidden = false;
      setTimeout(function () { m.classList.add('on'); }, 10);

      var done = false;
      function close(v) {
        if (done) return;
        done = true;
        m.classList.remove('on');
        document.removeEventListener('keydown', onKey);
        ok.onclick = null; cancel.onclick = null; m.onclick = null;
        setTimeout(function () { m.hidden = true; }, 180);
        resolve(v);
      }
      function onKey(e) {
        if (e.key === 'Escape') close(null);
        else if (e.key === 'Enter') close(opts.input ? inp.value : true);
      }
      document.addEventListener('keydown', onKey);
      ok.onclick = function () { close(opts.input ? inp.value : true); };
      cancel.onclick = function () { close(null); };
      m.onclick = function (e) { if (e.target === m) close(null); };
      if (opts.input) setTimeout(function () { inp.focus(); inp.select(); }, 60);
    });
  }
  function confirmBox(title, text, okText, danger) {

  function richPreview(text) {

      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (m, alt, src) {

      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return html.split('\n').filter(function (x) { return x.trim(); })
      .map(function (p) { return '<p>' + p + '</p>'; }).join('');
  }
  function refreshPrev(id) {

  function richInsert(text, target) {
    var el = target || richTarget;
    if (!el) return;
    var a = el.selectionStart || 0, b = el.selectionEnd || 0;
    var v = el.value, sel = v.slice(a, b);
    var out = text.replace('$1', sel || '');
    el.value = v.slice(0, a) + out + v.slice(b);
    el.focus();
    var pos = a + out.length - (out.indexOf(sel) === 0 && sel ? sel.length : 0);
    el.setSelectionRange(pos, pos);
  }

  function set(o, path, v) {

    for (var i = 0; i < ks.length - 1; i++) {

  function renderSchema(host, schema, data) {

        : f.type === 'check'

      '<div class="m-imgs">' + thumbs +
      '<button type="button" class="ghost sm" id="mAddImg">＋ 上传</button>' +
      '<button type="button" class="ghost sm" id="mAddLink">＋ 链接</button></div>';
  }
  function selectMoment(i) {
    state.momentIndex = i;
    renderMomentList();
    renderMomentForm();
  }
  function readMomentForm() {
    var m = state.moments.items[state.momentIndex];
    if (!m) return;
    if ($('#mDate')) m.date = $('#mDate').value.trim();
    if ($('#mText')) m.text = $('#mText').value;
  }
  function renderMoments() {
    state.momentIndex = Math.min(state.momentIndex, Math.max(0, state.moments.items.length - 1));
    renderMomentList();
    renderMomentForm();
  }
  $('#momentList').addEventListener('click', function (e) {
    var b = e.target.closest('[data-moment]');
    if (!b) return;
    selectMoment(Number(b.getAttribute('data-moment')));
  });
  if ($('#mFilter')) $('#mFilter').addEventListener('input', renderMomentList);

  $('#saveMoments').onclick = function () {
    readMomentForm();
    post('/api/moments', { data: state.moments }).then(function () {
      toast('已保存');
      renderMomentList();
    }).catch(function (e) { toast(e.message, true); });
  };
  $('#delMoment').onclick = function () {
    var m = state.moments.items[state.momentIndex];
    if (!m) return;
    confirmBox('删除这条说说', '删掉后就没了，不能恢复。', '删除', true).then(function (yes) {
      if (!yes) return;
      state.moments.items.splice(state.momentIndex, 1);
      state.momentIndex = 0;
      renderMoments();
      toast('已删除，记得点保存');
    });
  };
  document.getElementById('momentForm').addEventListener('click', function (e) {
    var m = state.moments.items[state.momentIndex];
    if (!m) return;
    if (e.target.id === 'mAddImg') {
      readMomentForm();
      upload(function (j) { m.images = m.images || []; m.images.push(j.path); renderMomentForm(); });
      return;
    }
    if (e.target.id === 'mAddLink') {
      modal({ title: '图片链接', input: true, value: 'https://', placeholder: 'https://... 或 /assets/...', okText: '添加' }).then(function (u2) {
        if (!u2) return;
        readMomentForm();
        m.images = m.images || [];
        m.images.push(u2.trim());
        renderMomentForm();
      });
      return;
    }
    var d = e.target.closest('[data-mimgdel]');
    if (d) {
      readMomentForm();
      m.images.splice(Number(d.getAttribute('data-mimgdel')), 1);
      renderMomentForm();
    }
  });

  /* ================= 相册 ================= */
  function loadGallery() {
    api('/api/gallery').then(function (j) {
      state.gallery = j.data || { albums: [] };
      state.gallery.albums = state.gallery.albums || [];
      renderAlbums();
      if (state.gallery.albums.length) selectAlbum(0);
    });
  }
  function renderAlbums() {
    $('#albumList').innerHTML = state.gallery.albums.map(function (a, i) {
      return '<button class="list-item' + (state.albumIndex === i ? ' on' : '') + '" data-ai="' + i + '">' +
        '<span class="li-t">' + esc(a.title) + '</span><span class="li-m">' + (a.images || []).length + ' 张</span></button>';
    }).join('') || '<p class="status">还没有相册。</p>';
  }
  $('#albumList').onclick = function (e) {
    var b = e.target.closest('[data-ai]');
    if (b) selectAlbum(Number(b.getAttribute('data-ai')));
  };
  function selectAlbum(i) {
    state.albumIndex = i;
    var a = state.gallery.albums[i];
    $('#albumForm').innerHTML =
      '<label>标题<input id="al-title" value="' + esc(a.title) + '"></label>' +
      '<label>短名<input id="al-slug" value="' + esc(a.slug) + '"></label>' +
      '<label>日期<input id="al-date" value="' + esc(a.date) + '"></label>' +
      '<label>封面（路径或链接）<input id="al-cover" value="' + esc(a.cover || '') + '"></label>' +
      '<label class="full">简介<textarea id="al-desc" rows="2">' + esc(a.desc || '') + '</textarea></label>';
    renderAlbumImages();
    renderAlbums();
  }
  function renderAlbumImages() {
    var a = state.gallery.albums[state.albumIndex];
    if (!a) { $('#albumImages').innerHTML = ''; return; }
    a.images = a.images || [];
    $('#albumImages').innerHTML = a.images.map(function (im, i) {
      var src = typeof im === 'string' ? im : im.src;
      var cap = typeof im === 'string' ? '' : (im.caption || '');
      return '<div class="thumb" data-th="' + i + '"><img src="' + esc(src) + '" alt="">' +
        '<button data-delimg="' + i + '">×</button>' +
        '<input data-cap="' + i + '" value="' + esc(cap) + '" placeholder="说明"></div>';
    }).join('');
    $('#albumImages').onclick = function (e) {
      var b = e.target.closest('[data-delimg]');
      if (!b) return;
      a.images.splice(Number(b.getAttribute('data-delimg')), 1);
      renderAlbumImages();
    };
  }
  $('#addAlbum').onclick = function () {
    state.gallery.albums.push({ slug: 'album-' + Date.now().toString(36), title: '新相册', date: new Date().toISOString().slice(0, 10), desc: '', cover: '', images: [] });
    selectAlbum(state.gallery.albums.length - 1);
  };
  $('#addImage').onclick = function () {
    var a = state.gallery.albums[state.albumIndex];
    if (!a) return toast('先建一个相册', true);
    upload(function (j) {
      a.images = a.images || [];
      a.images.push({ src: j.path, caption: '' });
      renderAlbumImages();
    });
  };
  $('#delAlbum').onclick = function () {
    confirmBox('删除相册', '相册和里面的照片记录会一起删除，图片文件还在。', '删除', true).then(function (yes) {
      if (!yes) return;
      state.gallery.albums.splice(state.albumIndex, 1);
    state.albumIndex = 0;
      if (state.gallery.albums.length) selectAlbum(0); else { renderAlbums(); $('#albumForm').innerHTML = ''; $('#albumImages').innerHTML = ''; }
    });
  };
  $('#saveGallery').onclick = function () {
    var a = state.gallery.albums[state.albumIndex];
    if (!a) return toast('没有相册', true);
    a.title = $('#al-title').value; a.slug = $('#al-slug').value; a.date = $('#al-date').value;
    a.cover = $('#al-cover').value; a.desc = $('#al-desc').value;
    $$('#albumImages [data-cap]').forEach(function (inp) {
      var i = Number(inp.getAttribute('data-cap'));
      if (a.images[i] && typeof a.images[i] === 'object') a.images[i].caption = inp.value;
      else if (a.images[i]) a.images[i] = { src: a.images[i], caption: inp.value };
    });
    post('/api/gallery', { data: state.gallery }).then(function () { toast('相册已保存'); renderAlbums(); })
      .catch(function (e) { toast(e.message, true); });
  };

  /* ================= 友链 ================= */
  function loadFriends() {
    api('/api/friends').then(function (j) {
      state.friends = j.data || { list: [] };
      state.friends.list = state.friends.list || [];
      $('#friendsForm').innerHTML =
        '<label class="full">页面导语<textarea id="fr-intro" rows="2">' + esc(state.friends.intro || '') + '</textarea></label>' +
        '<label class="full">没有友链时的文字<input id="fr-empty" value="' + esc(state.friends.emptyText || '') + '"></label>' +
        '<label class="full">底部说明<input id="fr-apply" value="' + esc(state.friends.applyText || '') + '"></label>';
      renderFriends();
    });
  }
  function renderFriends() {
    var host = $('#friendsRows');
    host.innerHTML = rowsHTML(state.friends.list, ['name', 'avatar', 'url', 'desc'], { name: '站名', avatar: '头像', url: '链接', desc: '简介' });
    bindDelete(host, state.friends.list, renderFriends);
  }
  $('#addFriend').onclick = function () {
    state.friends.list.push({ name: '', avatar: '', url: '', desc: '' });
    renderFriends();
  };
  $('#saveFriends').onclick = function () {
    state.friends.intro = $('#fr-intro').value;
    state.friends.emptyText = $('#fr-empty').value;
    state.friends.applyText = $('#fr-apply').value;
    readRows($('#friendsRows'), state.friends.list, []);
    post('/api/friends', { data: state.friends }).then(function () { toast('友链已保存'); }).catch(function (e) { toast(e.message, true); });
  };

  /* ================= 台词 ================= */
  function loadQuotes() {
    api('/api/quotes').then(function (j) {
      state.quotes = (j.data && j.data.quotes) || [];
      renderQuotes();
    });
  }
  function renderQuotes() {
    var host = $('#quoteRows');
    host.innerHTML = rowsHTML(state.quotes, ['text', 'from'], { text: '台词', from: '出处' });
    bindDelete(host, state.quotes, renderQuotes);
  }
  $('#addQuote').onclick = function () { state.quotes.push({ text: '', from: '' }); renderQuotes(); };
  $('#saveQuotes').onclick = function () {
    readRows($('#quoteRows'), state.quotes, []);
    post('/api/quotes', { data: { quotes: state.quotes } }).then(function () { toast('台词已保存'); }).catch(function (e) { toast(e.message, true); });
  };

  /* ================= 音乐 ================= */
  function loadMusic() {
    api('/api/site').then(function (j) {
      state.site = j.data;
      state.site.music = state.site.music || { songs: [] };
      $('#musicTitle').value = state.site.music.title || '';
      if ($('#musicAutoplay')) $('#musicAutoplay').checked = state.site.music.autoplay !== false;
      renderMusic();
    });
  }
  function renderMusic() {
    var host = $('#musicRows');
    var songs = state.site.music.songs || [];
    host.innerHTML = songs.map(function (s, i) {
      var local = !!s.src;
      return '<div class="music-row" draggable="false" data-row="' + i + '">' +
        '<span class="m-idx">' + (i + 1) + '</span>' +
        '<span class="m-drag" title="拖动排序">⠿</span>' +
        '<label>名称<input data-song="' + i + '" data-k="name" value="' + esc(s.name || '') + '">' +
        (s.ok === false ? '<span class="status">⚠ 放不出来</span>' : '') + '</label>' +
        '<label>' + (local ? '本地文件' : '网易云 id') + '<input data-song="' + i + '" data-k="' + (local ? 'src' : 'id') + '" value="' + esc(local ? s.src : (s.id || '')) + '"></label>' +
        '<span class="m-move"><button type="button" data-move="up" data-row="' + i + '" title="上移">↑</button>' +
        '<button type="button" data-move="down" data-row="' + i + '" title="下移">↓</button></span>' +
        '<button class="ghost sm del" data-songdel="' + i + '">×</button></div>';
    }).join('') || '<p class="status">还没有歌，点下面「上传本地音乐」或「手动加一首」。</p>';

    /* 删除 */
    host.onclick = function (e) {
      var b = e.target.closest('[data-songdel]');
      if (b) {
        syncSongs();
        songs.splice(Number(b.getAttribute('data-songdel')), 1);
        renderMusic();
        return;
      }
      var mv = e.target.closest('[data-move]');
      if (mv) {
        syncSongs();
        var from = Number(mv.getAttribute('data-row'));
        var to = mv.getAttribute('data-move') === 'up' ? from - 1 : from + 1;
        if (to < 0 || to >= songs.length) return;
        var item = songs.splice(from, 1)[0];
        songs.splice(to, 0, item);
        renderMusic();
      }
    };

    /* 拖拽排序 */
    var dragFrom = -1;
    $$('.music-row', host).forEach(function (row) {
      var grip = $('.m-drag', row);
      if (grip) {
        grip.addEventListener('mousedown', function () { row.draggable = true; });
        grip.addEventListener('touchstart', function () { row.draggable = true; }, { passive: true });
      }
      row.addEventListener('dragstart', function (e) {
        syncSongs();
        dragFrom = Number(row.getAttribute('data-row'));
        row.classList.add('dragging');
        try { e.dataTransfer.setData('text/plain', String(dragFrom)); e.dataTransfer.effectAllowed = 'move'; } catch (err) {}
      });
      row.addEventListener('dragend', function () { row.draggable = false; row.classList.remove('dragging'); });
      row.addEventListener('dragover', function (e) { e.preventDefault(); row.classList.add('over'); });
      row.addEventListener('dragleave', function () { row.classList.remove('over'); });
      row.addEventListener('drop', function (e) {
        e.preventDefault();
        row.classList.remove('over');
        var to = Number(row.getAttribute('data-row'));
        if (dragFrom < 0 || dragFrom === to) return;
        syncSongs();
        var moved = songs.splice(dragFrom, 1)[0];
        songs.splice(to, 0, moved);
        dragFrom = -1;
        renderMusic();
      });
    });
  }
  function syncSongs() {
    $$('#musicRows [data-song]').forEach(function (inp) {
      var i = Number(inp.getAttribute('data-song'));
      var song = state.site.music.songs[i];
      if (!song) return;
      var k = inp.getAttribute('data-k');
      song[k] = inp.value;
    });
  }
  $('#uploadMusic').onclick = function () {
    upload(function (j) {
      state.site.music.songs = state.site.music.songs || [];
      state.site.music.songs.push({ src: j.path, name: j.name.replace(/\.[^.]+$/, '') });
      renderMusic();
      toast('已添加：' + j.name);
    }, { audio: true });
  };
  $('#addMusic').onclick = function () {
    state.site.music.songs = state.site.music.songs || [];
    state.site.music.songs.push({ id: '', name: '' });
    renderMusic();
  };
  $('#parseMusic').onclick = function () {
    var url = $('#musicUrl').value.trim();
    if (!url) return toast('先粘贴链接', true);
    post('/api/music/parse', { url: url }).then(function (j) {
      state.site.music.songs = state.site.music.songs || [];
      state.site.music.songs.push({ id: j.id, name: j.name, ok: j.playable !== false });
      $('#musicUrl').value = '';
      renderMusic();
      toast(j.hint ? ('已添加：' + j.name + '（' + j.hint + '）') : ('已添加：' + j.name));
    }).catch(function (e) { toast(e.message, true); });
  };
  $('#saveMusic').onclick = function () {
    $$('#musicRows [data-song]').forEach(function (inp) {
      var i = Number(inp.getAttribute('data-song'));
      state.site.music.songs[i][inp.getAttribute('data-k')] = inp.value;
    });
    state.site.music.title = $('#musicTitle').value;
    if ($('#musicAutoplay')) state.site.music.autoplay = $('#musicAutoplay').checked;
    post('/api/site', { data: state.site }).then(function () { toast('歌单已保存'); }).catch(function (e) { toast(e.message, true); });
  };

  /* ================= 环境 ================= */
  function loadEnv() {
    $('#envStatus').textContent = '检查中…';
    api('/api/env').then(function (j) {
      $('#envStatus').textContent = j.ok ? '必需项都齐了' : '有必需项没满足';
      $('#envList').innerHTML = j.items.map(function (i) {
        var dot = i.level === 'info' ? '·' : (i.ok ? '✓' : '✗');
        var fix = (!i.ok && i.fix && i.fix.url)
          ? '<a class="ghost sm" href="' + i.fix.url + '" target="_blank" rel="noopener">' + esc(i.fix.text || '去安装') + '</a>'
          : '';
        return '<div class="env-row ' + (i.ok ? 'ok' : 'bad') + '">' +
          '<span class="env-dot">' + dot + '</span>' +
          '<span class="env-main"><b>' + esc(i.label) + '</b><span>' + esc(i.detail) + '</span></span>' +
          fix + '</div>';
      }).join('');
    }).catch(function (e) {
      $('#envStatus').textContent = e.message;
    });
  }
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('#recheckEnv')) loadEnv();
  });

  /* ================= 发布 ================= */
  function loadStatus() {
    api('/api/status').then(function (j) {
      $('#pubStatus').textContent = '分支 ' + (j.branch || '-') + ' · 待提交 ' + j.changes.length + ' 个文件 · 文章 ' + j.posts + ' 篇';
      if (j.remote && $('#gitRemote') && !$('#gitRemote').value) $('#gitRemote').value = j.remote;
    });
  }
  function gitAction(action) {
    var el = $('#pubLog');
    el.textContent = '执行中…';
    post('/api/git', { action: action, message: $('#commitMsg').value.trim(), remote: $('#gitRemote') ? $('#gitRemote').value.trim() : '', token: $('#gitToken') ? $('#gitToken').value.trim() : '' }).then(function (j) {
      el.textContent = (j.log || []).join('\n') + (j.hint ? '\n\n' + j.hint : '');
      toast(j.ok ? '完成' : (j.hint || '失败'), !j.ok);
      loadStatus();
    }).catch(function (e) { el.textContent = e.message; toast(e.message, true); });
  }
  $('#btnCommit').onclick = function () { gitAction('commit'); };
  $('#btnPush').onclick = function () { gitAction('push'); };
  $('#btnSync').onclick = function () { gitAction('sync'); };
  $('#btnPull').onclick = function () { gitAction('pull'); };

  $('#buildBtn').onclick = function () {
    post('/api/build', {}).then(function () { toast('已重新构建'); }).catch(function (e) { toast(e.message, true); });
  };
  $('#shutdownBtn').onclick = function () {
    confirmBox('停止写作台', '本地服务会关闭，页面 3 秒后尝试自动关上。', '停止', true).then(function (yes) {
      if (!yes) return;
      post('/api/shutdown', {}).catch(function () {}).finally(function () {
        var n = 3;
        document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;gap:8px;font-family:sans-serif"><b>写作台已停止</b><p id="bye">这个页面会在 3 秒后自动关闭…</p></div>';
        var t = setInterval(function () {
          n--;
          if (n > 0) { document.getElementById('bye').textContent = '这个页面会在 ' + n + ' 秒后自动关闭…'; return; }
          clearInterval(t);
          window.close();
          setTimeout(function () {
            document.body.innerHTML = '<div style="padding:60px;text-align:center;font-family:sans-serif">写作台已停止，可以关掉这个页面了。</div>';
          }, 500);
        }, 1000);
      });
    });
  };
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      var active = $('.pane.on');
      if (!active) return;
      var map = { 'pane-posts': '#savePost', 'pane-site': '#saveSite', 'pane-about': '#saveAbout', 'pane-moments': '#saveMoments', 'pane-gallery': '#saveGallery', 'pane-friends': '#saveFriends', 'pane-quotes': '#saveQuotes', 'pane-music': '#saveMusic' };
      var target = map[active.id];
      if (target && $(target)) $(target).click();
    }
  });

  /* 启动 */
  var startTab = '';
  try { startTab = new URLSearchParams(location.search).get('tab') || ''; } catch (e) {}
  if (startTab && $('[data-tab="' + startTab + '"]')) $('[data-tab="' + startTab + '"]').click();
  else loadPosts();
})();
</script>
</div>
</body>
</html>
