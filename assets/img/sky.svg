<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="水彩天空">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBE4EE"/>
      <stop offset="34%" stop-color="#FCEAE2"/>
      <stop offset="64%" stop-color="#F8E8DF"/>
      <stop offset="86%" stop-color="#F3E7E3"/>
      <stop offset="100%" stop-color="#FCF6F1"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7E2" stop-opacity=".95"/>
      <stop offset="52%" stop-color="#FFE2C6" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#FFD4C3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3DA" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FFF3DA" stop-opacity="0"/>
    </linearGradient>
    <filter id="wc" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.007 0.015" numOctaves="3" seed="11" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="80" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1150" cy="270" r="300" fill="url(#sun)"/>
  <path d="M1050 0 L1330 0 L1180 700 Z" fill="url(#beam)" opacity=".5" filter="url(#haze)"/>

  <g filter="url(#wc)" opacity=".85">
    <ellipse cx="270" cy="200" rx="430" ry="170" fill="#F6C2D6" opacity=".72"/>
    <ellipse cx="880" cy="120" rx="400" ry="150" fill="#FBE1EC" opacity=".8"/>
    <ellipse cx="1420" cy="380" rx="360" ry="210" fill="#F2D2E2" opacity=".5"/>
    <ellipse cx="660" cy="430" rx="540" ry="180" fill="#FFF0E5" opacity=".72"/>
    <ellipse cx="170" cy="650" rx="470" ry="220" fill="#DBE7F5" opacity=".38"/>
    <ellipse cx="1260" cy="760" rx="540" ry="250" fill="#E6EEF7" opacity=".34"/>
    <ellipse cx="760" cy="760" rx="620" ry="200" fill="#FFF8F2" opacity=".5"/>
  </g>

  <g fill="none" stroke="#8C7A84" stroke-linecap="round" opacity=".22">
    <path d="M1180 470 q16 -10 32 0 q16 -10 32 0" stroke-width="2"/>
    <path d="M1240 498 q11 -7 22 0 q11 -7 22 0" stroke-width="1.6"/>
    <path d="M1108 508 q9 -6 18 0 q9 -6 18 0" stroke-width="1.4"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity=".85"/>
</svg>
